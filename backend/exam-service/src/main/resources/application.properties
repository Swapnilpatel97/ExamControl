spring.application.name=exam-service
server.port=8082
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false

# MySQL Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/microservices_db
spring.datasource.username=root
spring.datasource.password=W7301@pri#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Correct Hibernate Dialect for Spring Boot 3 / Hibernate 6
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# LOB handling (safe for Hibernate 6)
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable Ribbon (already deprecated)
spring.cloud.loadbalancer.ribbon.enabled=false
