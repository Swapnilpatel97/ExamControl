spring.application.name=course-service
# Use random port if deployed in cloud, else set fixed port
server.port=8081
# server.port=${PORT:0}
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# MySQL Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/microservices_db
spring.datasource.username=root
spring.datasource.password=W7301@pri#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logging Hibernate SQL
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace

# Disable Ribbon (deprecated in Spring Cloud)
spring.cloud.loadbalancer.ribbon.enabled=false
